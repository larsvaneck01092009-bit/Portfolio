<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - RataPlan</title>
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" aria-label="Terug naar RataPlan">
            <img class="logo" src="images/rataplan.png" alt="RataPlan">
        </a>
        <nav>
            <a href="index.html">Terug naar de website</a>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-card">
            <h1>Neem contact op</h1>
            <p>Heb je een vraag? Stuur ons een bericht.</p>
            <form id="contact-form">
                <label for="name">Naam</label>
                <input type="text" id="name" name="name" required>

                <label for="email">E-mailadres</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Bericht</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Verstuur</button>
                <p id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="contact.js"></script>
</body>
</html>
